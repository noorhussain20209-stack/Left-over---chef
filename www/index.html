<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --cream:#FBF7EE;
  --cream-2:#F3EDDE;
  --charcoal:#2B2622;
  --charcoal-soft:#5C5449;
  --green:#3F6B4A;
  --green-deep:#2E4F37;
  --green-tint:#E4EEE3;
  --gold:#E3A73A;
  --gold-tint:#FBEDD2;
  --clay:#C15B3D;
  --line:#E7DFCE;
  --card:#FFFFFF;
  --shadow: 0 6px 24px rgba(43,38,34,0.08);
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --font-display:'Fraunces', serif;
  --font-body:'Public Sans', sans-serif;
}
[data-theme="dark"]{
  --cream:#20231F;
  --cream-2:#262A24;
  --charcoal:#F3EFE4;
  --charcoal-soft:#B9B2A2;
  --green:#7FB88A;
  --green-deep:#9FD4A8;
  --green-tint:#28352A;
  --gold:#F0C066;
  --gold-tint:#332B18;
  --clay:#E08464;
  --line:#3A3E35;
  --card:#282C26;
  --shadow: 0 6px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--charcoal);
  min-height:100vh;
  transition:background .3s ease, color .3s ease;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em;}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
img{max-width:100%;display:block;}
:focus-visible{outline:2px solid var(--green); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

#app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; background:var(--cream); box-shadow:0 0 60px rgba(0,0,0,0.06); padding-bottom:86px;}

/* ---- generic components ---- */
.screen{padding:22px 20px 8px;}
.eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--green); font-weight:700;}
.muted{color:var(--charcoal-soft);}
.btn{
  border:none; border-radius:16px; padding:14px 18px; font-weight:700; font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  transition:transform .15s ease, opacity .15s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--green); color:#fff;}
.btn-primary:disabled{opacity:.5;}
.btn-gold{background:var(--gold); color:var(--charcoal);}
.btn-ghost{background:transparent; color:var(--green); border:1.5px solid var(--green);}
.btn-secondary{background:var(--cream-2); color:var(--charcoal);}
.card{background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:18px; border:1px solid var(--line);}
.pill{padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); font-size:13px; font-weight:600; color:var(--charcoal-soft); cursor:pointer; transition:all .15s;}
.pill.active{background:var(--green-tint); border-color:var(--green); color:var(--green-deep);}
.chip{background:var(--gold-tint); color:#8a5a12; padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
[data-theme="dark"] .chip{color:var(--gold);}
.chip button{background:none;border:none;color:inherit;font-weight:800;font-size:14px;padding:0;}
.section-title{font-size:19px; margin:0 0 12px;}
.link{color:var(--green); font-weight:700; text-decoration:none; font-size:14px;}
.progress-track{height:5px; border-radius:99px; background:var(--line); overflow:hidden; margin-bottom:26px;}
.progress-fill{height:100%; background:var(--green); transition:width .3s ease;}
.warn-banner{background:#FBEAEA; border:1px solid #E9B6B6; color:#8B2E2E; padding:12px 14px; border-radius:14px; font-size:13px; display:flex; gap:8px; align-items:flex-start;}
[data-theme="dark"] .warn-banner{background:#3A2323; border-color:#5c3232; color:#f0a5a5;}
.notice{background:var(--green-tint); color:var(--green-deep); padding:12px 14px; border-radius:14px; font-size:13px;}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-in{animation:fadeIn .4s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.empty-state{text-align:center; padding:50px 20px;}
.empty-state .emoji{font-size:44px; margin-bottom:10px;}
.hidden{display:none !important;}

/* ---- top bar ---- */
.topbar{position:sticky; top:0; z-index:5; background:var(--cream); padding:16px 20px 10px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid transparent;}
.topbar.scrolled{border-color:var(--line);}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:18px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line); display:flex;align-items:center;justify-content:center; font-size:16px;}

/* ---- bottom nav ---- */
.bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--card); border-top:1px solid var(--line); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:20;}
.navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--charcoal-soft); font-size:10.5px; font-weight:700; padding:6px 0; border-radius:12px;}
.navbtn.active{color:var(--green);}
.navbtn .navicon{font-size:19px;}

/* ---- onboarding ---- */
.onboard-wrap{display:flex; flex-direction:column; min-height:calc(100vh - 30px); padding:26px 22px;}
.onboard-hero{font-size:30px; line-height:1.15; margin:10px 0 10px;}
.country-search{position:relative;}
.country-list{max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:14px; margin-top:8px; background:var(--card);}
.country-item{padding:12px 14px; font-size:14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between;}
.country-item:last-child{border-bottom:none;}
.country-item:active{background:var(--cream-2);}
.pref-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;}
.pref-tile{border:1.5px solid var(--line); border-radius:16px; padding:14px; text-align:center; font-weight:700; font-size:13.5px; background:var(--card);}
.pref-tile.active{border-color:var(--green); background:var(--green-tint); color:var(--green-deep);}

/* ---- home ---- */
.greeting{font-size:24px; margin:2px 0 2px;}
.action-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0;}
.action-tile{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px; box-shadow:var(--shadow); text-align:left;}
.action-tile .emoji{font-size:26px; display:block; margin-bottom:8px;}
.action-tile b{display:block; font-size:14.5px; margin-bottom:2px;}
.action-tile span{font-size:12px; color:var(--charcoal-soft);}
.searchbar{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px 16px; margin-top:6px;}
.searchbar input{border:none; outline:none; background:transparent; flex:1; font-size:14px; color:var(--charcoal);}

/* ---- recipe card ---- */
.recipe-card{background:var(--card); border-radius:var(--radius-md); border:1px solid var(--line); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
.recipe-top{display:flex; justify-content:space-between; gap:10px;}
.recipe-title{font-size:16.5px; margin:0 0 2px;}
.recipe-meta{display:flex; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--charcoal-soft); margin:8px 0;}
.avail-badge{background:var(--gold-tint); color:#8a5a12; font-weight:700; padding:2px 8px; border-radius:999px;}
[data-theme="dark"] .avail-badge{color:var(--gold);}
.fav-btn{background:none; border:none; font-size:19px;}

/* ---- ingredient input ---- */
.ing-row{display:flex; gap:8px; margin-bottom:12px;}
.ing-row input{flex:1; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-size:14px; background:var(--card); color:var(--charcoal);}

/* ---- cooking mode ---- */
.cook-overlay{position:fixed; inset:0; background:var(--cream); z-index:100; display:flex; flex-direction:column; max-width:480px; margin:0 auto; padding:20px;}
.step-text{font-size:19px; line-height:1.5; flex:1; margin-top:16px;}
.timer-box{background:var(--green-tint); border-radius:16px; padding:14px; text-align:center; margin-top:14px;}
.timer-num{font-family:var(--font-display); font-size:30px; color:var(--green-deep);}

/* ---- explore ---- */
.cuisine-scroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin:12px 0 20px;}
.cuisine-card{flex:0 0 auto; width:118px; height:88px; border-radius:16px; background:linear-gradient(135deg,var(--green-tint),var(--gold-tint)); display:flex; align-items:flex-end; padding:10px; font-weight:700; font-size:12.5px; color:var(--charcoal); border:1px solid var(--line);}
.hist-card{border-left:3px solid var(--gold); padding-left:12px; margin-bottom:16px;}
.tag-recon{font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--gold-tint); color:#8a5a12;}
[data-theme="dark"] .tag-recon{color:var(--gold);}
.tag-doc{font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--green-tint); color:var(--green-deep);}

/* ---- camera ---- */
.camera-wrap{background:#000; border-radius:20px; overflow:hidden; position:relative; aspect-ratio:3/4;}
.camera-wrap video{width:100%; height:100%; object-fit:cover;}
.shutter{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25); position:absolute; bottom:16px; left:50%; transform:translateX(-50%);}

/* ---- settings ---- */
.setting-row{display:flex; justify-content:space-between; align-items:center; padding:14px 2px; border-bottom:1px solid var(--line); font-size:14.5px;}
.switch{width:44px; height:26px; background:var(--line); border-radius:99px; position:relative; border:none; flex-shrink:0;}
.switch.on{background:var(--green);}
.switch .knob{width:20px;height:20px;background:#fff;border-radius:50%; position:absolute; top:3px; left:3px; transition:left .2s ease;}
.switch.on .knob{left:21px;}

/* toast */
#toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--charcoal); color:var(--cream); padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; max-width:88%; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* =========================================================================
   LEFTOVER CHEF — single-file reference build
   -------------------------------------------------------------------------
   This is a fully working front-end (state, routing, persistence, the full
   onboarding→home→cook→explore→favorites→settings flow, a working AI recipe
   engine, a working camera flow, allergy/safety checks, shopping list,
   cooking mode, dark mode).

   TWO THINGS ARE STRUCTURALLY MOCKED because they cannot exist safely inside
   a single client-side file, and are clearly marked below:
   1) AI_ENGINE.generate() — calls a local recipe-composition engine instead
      of a hosted LLM, because a real call requires a server that holds the
      API key (never ship a secret key in client code — see AI_ENGINE comment
      for the exact drop-in replacement).
   2) CAMERA.recognize() — takes a real photo from the device camera, but
      "identifying" ingredients from it needs a vision model behind that same
      server. It's wired to call AI_ENGINE.recognizeFromImage(), which you
      swap for a real endpoint the same way.
   Every other feature (onboarding, preferences, allergies, ingredient list,
   recipe generation from what you actually have, cooking mode, favorites,
   shopping list, settings, dark mode) is fully functional right now.
   ========================================================================= */

/* ---------------- STATE / PERSISTENCE ---------------- */
const DB_KEY = "leftoverchef_state_v1";
const defaultState = {
  onboarded:false,
  onboardStep:0,
  profile:{ name:"Chef", country:"", region:"", diets:[], allergies:[], skill:"Beginner", notifPermission:"unknown", cameraPermission:"unknown" },
  theme:"light",
  ingredients:[], // [{name, qty, unit, expiry}]
  favorites:[],   // recipe objects
  shoppingList:[], // [{name, amount, checked, forRecipe}]
  history:[],     // recently cooked
  route:"home",
  lastRecipes:[]
};
let state = load();
function load(){
  try{ const raw = localStorage.getItem(DB_KEY); return raw ? {...defaultState, ...JSON.parse(raw)} : structuredClone(defaultState); }
  catch(e){ return structuredClone(defaultState); }
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); }catch(e){ console.warn("save failed", e); } }
function setState(patch){ state = {...state, ...patch}; save(); render(); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------------- COUNTRY DATA (abridged global list) ---------------- */
const COUNTRIES = ["Afghanistan","Algeria","Argentina","Australia","Austria","Bangladesh","Belgium","Brazil","Canada","Chile","China","Colombia","Egypt","Ethiopia","France","Germany","Ghana","Greece","India","Indonesia","Iran","Iraq","Ireland","Italy","Japan","Jordan","Kenya","South Korea","Lebanon","Malaysia","Mexico","Morocco","Netherlands","New Zealand","Nigeria","Pakistan","Peru","Philippines","Poland","Portugal","Russia","Saudi Arabia","Singapore","South Africa","Spain","Sri Lanka","Sweden","Switzerland","Thailand","Turkey","Ukraine","United Arab Emirates","United Kingdom","United States","Vietnam"];

/* ---------------- DIET / ALLERGY OPTIONS ---------------- */
const DIETS = ["Vegetarian","Vegan","Halal","Gluten-free","Dairy-free","Nut-free","Low-spice","Spicy","No preference"];
const COMMON_ALLERGENS = ["Peanuts","Tree nuts","Milk","Eggs","Wheat","Soy","Fish","Shellfish","Sesame"];

/* ---------------- RECIPE KNOWLEDGE BASE (engine's raw material) ----------------
   Each ingredient is {n:name, a:amount-for-base-servings, opt:boolean}.
   dietFlags marks what the dish IS (used to include/exclude by preference).
   equipment/storage/foodSafety back the "correct and detailed" recipe view. */
const RECIPE_BASE = [
  {title:"Creamy Tomato Pasta", cuisine:"Italian-inspired (Italy)", tags:["quick","dinner","pasta"], dietFlags:["vegetarian"],
    ing:[{n:"pasta",a:"200 g"},{n:"tomato",a:"3 medium, chopped"},{n:"garlic",a:"2 cloves, minced"},{n:"olive oil",a:"2 tbsp"},{n:"cream",a:"100 ml"},{n:"basil",a:"a handful, torn",opt:true},{n:"parmesan",a:"30 g, grated",opt:true},{n:"chili flakes",a:"1/4 tsp",opt:true}],
    difficulty:"Easy", prep:"10 min", cook:"20 min", servings:2, equipment:["Large pot","Wide sauté pan","Colander"],
    steps:["Bring a large pot of salted water to a boil and cook the pasta until al dente, about 9–11 minutes.","Meanwhile, warm the olive oil in a wide pan over medium heat and sauté the garlic 30–60 seconds until fragrant, not browned.","Add the chopped tomato and a pinch of salt; simmer 8 minutes, mashing lightly, until it breaks down into a sauce.","Stir in the cream and simmer 2 minutes; taste and adjust salt.","Drain the pasta, reserving a splash of pasta water, then toss it through the sauce, loosening with pasta water if needed.","Finish with torn basil, parmesan and chili flakes if using."],
    subs:["No cream? Whisk 1 tsp flour into 100 ml full-fat milk and simmer until it thickens slightly.","No fresh tomato? 400 g canned crushed tomato works and needs less simmering time."],
    storage:"Keeps in an airtight container in the fridge for up to 3 days. Reheat gently with a splash of water or milk to loosen the sauce.",
    foodSafety:["Reheat leftovers until steaming hot all the way through before eating."]},

  {title:"Leftover Rice Stir-Fry", cuisine:"East Asian-inspired", tags:["leftover","quick","dinner"], dietFlags:[],
    ing:[{n:"rice",a:"2 cups, cooked and cooled"},{n:"egg",a:"2 large"},{n:"soy sauce",a:"2 tbsp"},{n:"garlic",a:"2 cloves, minced"},{n:"spring onion",a:"2, sliced",opt:true},{n:"carrot",a:"1, diced",opt:true},{n:"peas",a:"1/2 cup",opt:true},{n:"chicken",a:"150 g, cooked and diced",opt:true}],
    difficulty:"Easy", prep:"5 min", cook:"10 min", servings:2, equipment:["Wok or wide frying pan","Spatula"],
    steps:["Heat 1 tbsp oil in a wok or wide pan over high heat until shimmering.","Pour in the beaten egg, scramble lightly until just set, then remove and set aside.","Add a little more oil, then the garlic and any raw vegetables; stir-fry 2 minutes.","Add the cold rice, breaking up clumps with the spatula, and stir-fry 3–4 minutes until heated through and slightly crisp in places.","Return the egg (and any cooked chicken), add the soy sauce, toss everything together and serve hot."],
    subs:["No soy sauce? A pinch of salt plus a small splash of vinegar gives a similar savory-sour lift."],
    storage:"Best eaten fresh. If storing, cool quickly and refrigerate within 1 hour; use within 1 day, since reheated rice carries higher food-safety risk if cooled slowly.",
    foodSafety:["Cooked rice that's been left at room temperature for more than 2 hours should be discarded rather than reused.","Reheat until piping hot throughout, not just warmed."]},

  {title:"Potato & Onion Stuffed Flatbread", cuisine:"South Asian-inspired (North India / Pakistan region)", tags:["budget","5-ingredients","bread"], dietFlags:["vegetarian","vegan"],
    ing:[{n:"potato",a:"3 medium, boiled"},{n:"flour",a:"2 cups"},{n:"onion",a:"1 small, finely chopped"},{n:"salt",a:"1 tsp, divided"},{n:"chili",a:"1, finely chopped",opt:true},{n:"cumin",a:"1/2 tsp",opt:true},{n:"coriander leaves",a:"a small handful, chopped",opt:true}],
    difficulty:"Medium", prep:"20 min", cook:"20 min", servings:4, equipment:["Mixing bowl","Rolling pin","Flat griddle or heavy pan"],
    steps:["Mash the boiled potatoes with the onion, half the salt, chili, cumin and coriander leaves.","Knead the flour with the remaining salt and enough water to form a soft, smooth dough; rest 10 minutes.","Divide the dough into 4 balls; flatten each, place a portion of potato filling in the center, and gather the edges to seal.","Roll each stuffed ball out gently into a flatbread about 15 cm across, being careful not to tear it.","Cook on a hot dry griddle 2–3 minutes per side until browned in spots, pressing lightly with a spatula so it cooks evenly.","Brush lightly with oil or ghee and serve warm."],
    subs:["No fresh chili? A pinch of chili powder mixed into the filling works just as well."],
    storage:"Wrap and refrigerate for up to 2 days; reheat on a dry pan. Not recommended for freezing as the texture suffers.",
    foodSafety:[]},

  {title:"Simple Chocolate Cake", cuisine:"Classic bake", tags:["dessert","cakes","baking"], dietFlags:["vegetarian"],
    ing:[{n:"flour",a:"200 g"},{n:"sugar",a:"180 g"},{n:"cocoa powder",a:"40 g"},{n:"egg",a:"2 large"},{n:"butter",a:"115 g, softened"},{n:"milk",a:"120 ml"},{n:"baking powder",a:"1.5 tsp",opt:true},{n:"vanilla",a:"1 tsp",opt:true}],
    difficulty:"Medium", prep:"15 min", cook:"30 min", servings:8, oven:"180°C / 350°F (preheat before starting)", pan:"20 cm round cake pan, greased and lined",
    equipment:["Mixing bowl","Hand or stand mixer","20 cm round pan","Wire rack","Skewer or toothpick"],
    steps:["Preheat the oven to 180°C (350°F) and grease and line a 20 cm round pan.","Cream the softened butter and sugar together 3–4 minutes until visibly lighter and fluffy.","Beat in the eggs one at a time, mixing well after each, then stir in the vanilla.","Sift together the flour, cocoa powder and baking powder; fold into the butter mixture in three additions, alternating with the milk, until just combined — do not overmix.","Pour the batter into the prepared pan and smooth the top.","Bake 28–32 minutes, until a skewer inserted in the center comes out clean or with a few moist crumbs.","Cool in the pan 10 minutes, then turn out onto a wire rack to cool completely before slicing or frosting."],
    subs:["No butter? Use a neutral oil at about 80% of the butter weight (e.g. 90 ml oil for 115 g butter)."],
    storage:"Store covered at room temperature up to 3 days, or refrigerate up to a week if frosted with dairy. Freezes well, unfrosted, for up to 2 months.",
    foodSafety:["Cake containing raw batter should not be tasted before baking due to raw egg and flour."]},

  {title:"No-Knead Everyday Bread", cuisine:"Classic bake", tags:["bread","baking","budget"], dietFlags:["vegetarian","vegan"],
    ing:[{n:"flour",a:"450 g, bread or all-purpose"},{n:"water",a:"350 ml, room temperature"},{n:"yeast",a:"1/2 tsp instant"},{n:"salt",a:"2 tsp"},{n:"olive oil",a:"1 tbsp",opt:true},{n:"seeds",a:"2 tbsp, for topping",opt:true}],
    difficulty:"Easy", prep:"10 min + rise", cook:"35 min", servings:6, oven:"230°C / 450°F, with a covered pot inside while preheating",
    equipment:["Large mixing bowl","Dutch oven or heavy covered pot","Wire rack"],
    steps:["Mix the flour, salt and yeast in a large bowl, then stir in the water until you get a shaggy, sticky dough — no kneading needed.","Cover the bowl and let it rise at room temperature for 8–12 hours (or about 2 hours somewhere warm), until doubled and bubbly.","About 30 minutes before baking, place your covered pot in the oven and preheat to 230°C (450°F).","Turn the dough onto a floured surface and shape it gently into a round, being careful not to knock out too much air.","Carefully drop the dough into the hot pot, cover, and bake 25 minutes.","Uncover and bake a further 10 minutes until deep golden brown; the loaf should sound hollow when tapped on the base.","Cool completely on a wire rack before slicing — cutting too early makes it gummy."],
    subs:["No dutch oven? Bake on a preheated tray with a shallow pan of hot water on the oven floor to mimic the steam."],
    storage:"Best eaten within 2–3 days, kept cut-side down at room temperature. Freezes well sliced, up to 3 months.",
    foodSafety:[]},

  {title:"Chickpea & Vegetable Curry", cuisine:"South Asian-inspired", tags:["dinner","budget","healthy"], dietFlags:["vegetarian","vegan","gluten-free"],

function detectCuisine(text, profile){
  const t = text.toLowerCase();
  // Check cuisine keys, adjective forms, and country-name aliases together
  for(const key in CUISINE_PROFILES){
    const p = CUISINE_PROFILES[key];
    const candidates = [key, p.cuisine.toLowerCase(), ...(p.aliases||[])];
    if(candidates.some(c => t.includes(c))) return p;
  }
  // Fall back to the user's own saved country, if it maps to a known profile
  if(profile && profile.country){
    const pc = profile.country.toLowerCase();
    for(const key in CUISINE_PROFILES){
      const p = CUISINE_PROFILES[key];
      const candidates = [key, p.cuisine.toLowerCase(), ...(p.aliases||[])];
      if(candidates.some(c => pc.includes(c) || c.includes(pc))) return p;
    }
  }
  // No recognized cuisine/country in the request — this is still a specific
  // dish, just one we don't have a named regional profile for yet. Build a
  // generic-but-real profile from the request itself rather than a bland
  // "Global" placeholder, so the recipe still feels tailored to what was typed.
  return {cuisine:"Home-style", region:"a tradition not yet in our cuisine directory — built from general technique instead", staples:["onion","garlic","olive oil or a local cooking fat","salt","black pepper"], starch:"rice, bread, or the starch traditional to this dish"};
}

function detectMethod(text){
  const t = text.toLowerCase();
  if(/(cake|cookie|biscuit|bread|loaf|muffin|cupcake|pie|tart|quiche|naan|roti|paratha|pita|flatbread|brownie|pastry|bake|baking)/.test(t)) return "bake";
  if(/(curry|stew|tagine|braise)/.test(t)) return "stew";
  if(/(stir.?fry|wok)/.test(t)) return "stirfry";
  if(/(soup|broth|bisque)/.test(t)) return "soup";
  if(/(grill|kebab|bbq|barbecue|roast|steak)/.test(t)) return "grill";
  if(/(rice|pilaf|biryani|paella|risotto|jollof)/.test(t)) return "ricedish";
  if(/(noodle|pasta|ramen|pho|spaghetti)/.test(t)) return "noodle";
  if(/(dumpling|momo|gyoza|pierogi|wonton|samosa)/.test(t)) return "dumpling";
  if(/(salad|slaw)/.test(t)) return "salad";
  if(/(pudding|mousse|ice cream|no.?bake|parfait)/.test(t)) return "dessertnobake";
  return "stovetop";
}

/** Composes a full recipe for an arbitrary dish name/request when nothing in
 *  RECIPE_BASE is a close match. Clearly marked as AI-composed in the UI. */
function composeRecipe(dishNameRaw, have, profile){
  const dishName = (dishNameRaw||"a dish").trim();
  const searchText = dishName;
  const cuisineProfile = detectCuisine(searchText, profile);
  const method = detectMethod(searchText);
  const title = dishName.length>3 ? capitalize(dishName) : `${cuisineProfile.cuisine} Dish`;

  let steps, ingredients, oven=null, pan=null, equipment=[], prep="15 min", cook="25 min", difficulty="Medium";

  if(method === "bake"){
    const subtype = detectBakeSubtype(searchText);
    const b = BAKE_SUBTYPES[subtype];
    oven = b.ovenDefault; pan = b.panDefault;
    equipment = ["Mixing bowl","Measuring cups/spoons", subtype==="bread"||subtype==="flatbread" ? "Work surface for kneading":"Hand or stand mixer", pan];
    steps = [`Preheat the oven to ${oven}${subtype==="flatbread"?" (or skip — this is cooked on the stovetop)":""} and prepare your ${pan}.`, ...b.mix, ...b.finish];
    ingredients = [
      {n:"flour",a:"a base of 250–350 g depending on batch size"},
      {n:"sugar",a: subtype==="bread"||subtype==="flatbread" ? "a pinch, if the recipe calls for it" : "150–180 g", opt: subtype==="bread"||subtype==="flatbread"},
      {n: subtype==="bread"||subtype==="flatbread" ? "yeast or another leavening" : "baking powder or baking soda", a:"as needed for the leavening this bake type uses"},
      {n:"salt", a:"1/2–1 tsp"},
      {n:"egg", a:"1–2 large", opt: subtype==="bread"||subtype==="flatbread"},
      {n: subtype==="bread"||subtype==="flatbread" ? "water" : "milk", a:"as needed to bring the mixture together"},
      {n:"butter or oil", a:"as the recipe's fat component"}
    ];
    prep = subtype==="bread" ? "20 min + rise" : "15 min"; cook = "20–30 min"; difficulty = subtype==="pie"||subtype==="bread" ? "Hard":"Medium";
  } else {
    const m = METHOD_TEMPLATES[method];
    steps = m.steps(cuisineProfile);
    ingredients = [
      ...cuisineProfile.staples.map((s,i)=>({n:s, a:i<2?"to taste":"a small amount", opt:i>=2})),
      {n:capitalize(dishName)+" (main ingredient)", a:"to taste — use what you have on hand"},
      {n:cuisineProfile.starch.split(" or ")[0], a:"to serve", opt:true}
    ];
    equipment = method==="bake" ? [] : method==="soup"||method==="stew" ? ["Large pot"] : method==="stirfry" ? ["Wok or wide pan"] : ["Pan or pot"];
    difficulty = "Medium";
  }

  const ingObjs = ingredients.map(i=>({
    name:i.n, amount:i.a, optional: !!i.opt,
    have: have.some(h => i.n.toLowerCase().includes(h) || h.includes(i.n.toLowerCase()))
  }));
  const haveCount = ingObjs.filter(i=>i.have).length;
  const pct = have.length ? Math.max(20, Math.min(70, Math.round((haveCount/ingObjs.length)*100)+15)) : 30;

  const allergyHits = (profile.allergies||[]).filter(a =>
    (ALLERGEN_KEYWORDS[a]||[a.toLowerCase()]).some(kw => ingObjs.some(i=>i.name.toLowerCase().includes(kw)))
  );
  const safetyNotes = [];
  if(allergyHits.length) safetyNotes.push(`May conflict with your saved allergy/avoidance: ${allergyHits.join(", ")}. Check carefully before cooking.`);
  safetyNotes.push(`This recipe was composed by the app's recipe engine for "${dishName}" based on common ${cuisineProfile.cuisine} techniques, rather than pulled from a single verified source — cross-check quantities and technique against a trusted recipe if this dish has a traditional method you want to match exactly.`);

  return {
    title, description:`An AI-composed ${cuisineProfile.cuisine} recipe idea for ${dishName}, built from common ${METHOD_TEMPLATES[method]?METHOD_TEMPLATES[method].label:"baking"} technique.`,
    cuisine:`${cuisineProfile.cuisine}-inspired (${cuisineProfile.region})`, prepTime:prep, cookTime:cook, servings:4, difficulty,
    oven, pan, equipment, ingredients:ingObjs, steps, substitutions:[], storage:"Storage varies by dish — refrigerate leftovers within 2 hours and use within 3–4 days as a general rule.",
    missing: ingObjs.filter(i=>!i.have && !i.optional), percentAvailable: pct, safetyNotes, composed:true
  };
}
function capitalize(s){ return s.replace(/\b\w/g, c=>c.toUpperCase()); }

/* =========================================================================
   AI ENGINE — recipe generation + image-based ingredient recognition
   -------------------------------------------------------------------------
   generate() currently scores/composes recipes from RECIPE_BASE locally so
   the app is fully functional offline and with zero secrets in the client.

   TO CONNECT A REAL LLM (recommended for production):
   Replace the body of generate() with a fetch() to YOUR OWN backend route,
   e.g. POST /api/generate-recipe — never call the Anthropic API directly
   from this file, since that would require embedding a secret key in code
   that ships to every user's device. Your backend route holds the key and
   forwards a prompt like the one described in AI_PROMPT_TEMPLATE below,
   then returns JSON in the same shape generate() returns today, so no other
   code in this file needs to change.
   ========================================================================= */
const AI_PROMPT_TEMPLATE = `You are the recipe engine for Leftover Chef.
Country/region: {{country}} | Diets: {{diets}} | Allergies to avoid: {{allergies}}
Ingredients on hand: {{ingredients}}
Free-form request: "{{request}}"
Return recipes prioritizing max use of on-hand ingredients and fewest extra purchases.
Never assert 100% safety. Flag possible allergy conflicts instead of silently substituting.`;

const AI_ENGINE = {
  async generate({ingredients, request, profile}){
    await wait(1400); // simulated "thinking" time — long enough for the rotating status messages to show
    try{
      const have = ingredients.map(i=>i.name.toLowerCase().trim()).filter(Boolean);
      const reqLower = (request||"").toLowerCase();
      const reqWords = reqLower.split(/[^a-z0-9]+/).filter(w=>w.length>2);

      // Parse "without X" / "no X" exclusions from the free-text request
      const exclusions = [];
      const withoutMatch = reqLower.match(/\b(?:without|no)\s+([a-z\s]+)/g);
      if(withoutMatch) withoutMatch.forEach(m=>{
        const term = m.replace(/^(without|no)\s+/,"").trim().split(/[.,;]/)[0].trim();
        if(term) exclusions.push(term);
      });

      let pool = RECIPE_BASE;
      let hadDirectMatch = false;

      // Bias toward matching titles/cuisine/tags when there's a specific request.
      // Uses whole-word matching (not substring) so short words like "wat" don't
      // false-match inside unrelated ingredients like "water".
      if(reqWords.length){
        const matched = RECIPE_BASE.filter(r =>
          reqWords.some(w => wordMatch(r.title, w) || r.tags.includes(w) || wordMatch(r.cuisine, w) || r.ing.some(i=>wordMatch(i.n, w)))
        );
        if(matched.length){ pool = matched; hadDirectMatch = true; }
      }

      // Respect saved diet preferences (Vegetarian, Vegan, Gluten-free, etc.)
      const activeDiets = (profile.diets||[]).filter(d=>d!=="No preference" && d!=="Spicy" && d!=="Low-spice");
      if(activeDiets.length){
        const dietFiltered = pool.filter(r => activeDiets.every(d=>{
          const excludeList = DIET_EXCLUDES[d];
          if(!excludeList) return true; // Halal/Low-spice/Spicy aren't ingredient-excludable here — flagged in notes instead
          return !r.ing.some(i => excludeList.some(bad => i.n.toLowerCase().includes(bad)));
        }));
        if(dietFiltered.length) pool = dietFiltered;
        else if(hadDirectMatch) hadDirectMatch = false; // diet wiped out the only matches — fall through to compose instead
      }

      let scored = pool.map(r=>{
        const allIng = r.ing;
        const haveCount = allIng.filter(i => have.some(h => i.n.toLowerCase().includes(h) || h.includes(i.n.toLowerCase()))).length;
        const requiredCount = allIng.filter(i=>!i.opt).length || allIng.length;
        const haveRequired = allIng.filter(i=>!i.opt).filter(i => have.some(h => i.n.toLowerCase().includes(h) || h.includes(i.n.toLowerCase()))).length;
        let pct = Math.round((haveCount / allIng.length) * 100);
        if(!have.length) pct = Math.min(35 + Math.round((haveRequired/requiredCount)*10), 60);
        return {r, pct: Math.max(Math.min(pct, 98), 15)};
      }).sort((a,b)=> b.pct - a.pct);

      if(!ingredients.length && !reqWords.length){
        scored = pool.map(r=>({r, pct: 40 + Math.floor(Math.random()*30)}));
      }

      // A specific request with no close curated match: compose a tailored recipe
      // instead of returning loosely-related curated dishes.
      if(reqWords.length && !hadDirectMatch){
        const composed = composeRecipe(request, have, profile);
        const curatedTop = scored.slice(0,2).map(({r,pct}) => buildRecipe(r, pct, have, profile, exclusions));
        return [composed, ...curatedTop];
      }

      const top = scored.slice(0,4).map(({r,pct}) => buildRecipe(r, pct, have, profile, exclusions));
      return top;
    }catch(e){
      console.error(e);
      throw new Error("generation_failed");
    }
  },

  // Mock vision recognition for the camera flow — see file header note.
  async recognizeFromImage(){
    await wait(1100);
    const guesses = [
      ["tomato","onion","garlic"], ["egg","milk","flour"], ["potato","carrot","onion"],
      ["rice","chicken","pepper"], ["banana","flour","egg"]
    ];
    return guesses[Math.floor(Math.random()*guesses.length)];
  }
};

function buildRecipe(r, pct, have, profile, exclusions){
  const allIngNames = r.ing.map(i=>i.n.toLowerCase());
  const allergyHits = (profile.allergies||[]).filter(a =>
    (ALLERGEN_KEYWORDS[a]||[a.toLowerCase()]).some(kw => allIngNames.some(ing => ing.includes(kw)))
  );
  const exclusionHits = (exclusions||[]).filter(ex => allIngNames.some(ing => ing.includes(ex) || ex.includes(ing)));

  const ingredients = r.ing.map(i=>({
    name:i.n, amount:i.a, optional: !!i.opt,
    have: have.some(h=> i.n.toLowerCase().includes(h) || h.includes(i.n.toLowerCase()))
  }));
  const missing = ingredients.filter(i=>!i.have && !i.optional);
  const haveCount = ingredients.filter(i=>i.have).length;

  // Description is composed from what's actually true of this match, not a canned line
  let description = `A ${r.difficulty.toLowerCase()} ${r.cuisine} recipe, ready in about ${addTimes(r.prep,r.cook)}.`;
  if(have.length){
    description += haveCount>0
      ? ` Uses ${haveCount} of ${ingredients.length} ingredients from what you've listed.`
      : ` Doesn't overlap much with what you've listed — worth checking the missing ingredients below.`;
  }

  const safetyNotes = [];
  if(allergyHits.length) safetyNotes.push(`May conflict with your saved allergy/avoidance: ${allergyHits.join(", ")}. Check the ingredient list carefully before cooking.`);
  if(exclusionHits.length) safetyNotes.push(`You asked to avoid ${exclusionHits.join(", ")} — this recipe normally includes it; see the substitution notes or remove it before cooking.`);
  if(r.foodSafety && r.foodSafety.length) safetyNotes.push(...r.foodSafety);

  return {
    title:r.title, description, cuisine:r.cuisine, prepTime:r.prep, cookTime:r.cook, servings:r.servings, difficulty:r.difficulty,
    oven:r.oven||null, pan:r.pan||null, equipment:r.equipment||[], ingredients, steps:r.steps,
    substitutions:r.subs||[], storage:r.storage||"", missing,
    percentAvailable: pct, safetyNotes
  };
}
function addTimes(prep,cook){
  const p = parseInt(prep)||0, c = parseInt(cook)||0;
  if(!p && !c) return cook || prep || "a few minutes";
  return `${p+c} min`;
}
function wait(ms){ return new Promise(res=>setTimeout(res, ms)); }
function wordMatch(haystack, word){
  if(!haystack || !word) return false;
  const esc = word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return new RegExp('\\b'+esc+'\\b','i').test(haystack); }
  catch(e){ return haystack.toLowerCase().includes(word.toLowerCase()); }
}

   (see AI_ENGINE.recognizeFromImage note above).

let mediaStream = null;
async function startCamera(){
  const video = document.getElementById("camVideo");
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    video.srcObject = mediaStream;
    setState({profile:{...state.profile, cameraPermission:"granted"}});
  }catch(e){
    setState({profile:{...state.profile, cameraPermission:"denied"}});
    toast("Camera access denied — you can still add ingredients manually.");
  }
}
function stopCamera(){ if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; } }

async function captureAndRecognize(){
  const scanResult = document.getElementById("scanResult");
  scanResult.innerHTML = `<div class="notice" style="display:flex;align-items:center;gap:10px;"><div class="spinner" style="border-top-color:var(--green); border-color:rgba(63,107,74,.25)"></div> Looking at your ingredients…</div>`;
  try{
    const detected = await AI_ENGINE.recognizeFromImage();
    scanResult.innerHTML = `
      <p class="muted" style="font-size:13px; margin:14px 0 8px;">We think we spotted these — confirm or edit before adding:</p>
      <div id="detectedChips" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
        ${detected.map((d,i)=>`<span class="chip" data-i="${i}">${d} <button onclick="removeDetected(${i})">×</button></span>`).join("")}
      </div>
      <button class="btn btn-primary" onclick="confirmDetected()">Add confirmed ingredients</button>
      <p class="muted" style="font-size:11.5px; margin-top:10px;">Camera recognition isn't always accurate — please double-check before cooking.</p>
    `;
    window._detected = detected;
  }catch(e){
    scanResult.innerHTML = `<div class="warn-banner">⚠ Couldn't recognize ingredients right now. Please add them manually instead.</div>`;
  }
}
function removeDetected(i){ window._detected.splice(i,1); captureAndRecognizeRerender(); }
function captureAndRecognizeRerender(){
  const scanResult = document.getElementById("scanResult");
  const detected = window._detected;
  scanResult.querySelector("#detectedChips").innerHTML = detected.map((d,i)=>`<span class="chip" data-i="${i}">${d} <button onclick="removeDetected(${i})">×</button></span>`).join("");
}
function confirmDetected(){
  const detected = window._detected || [];
  const newOnes = detected.filter(d=> !state.ingredients.some(i=>i.name.toLowerCase()===d.toLowerCase()));
  setState({ingredients:[...state.ingredients, ...newOnes.map(n=>({name:n, qty:"", unit:"", expiry:""}))]});
  toast(`Added ${newOnes.length} ingredient${newOnes.length!==1?"s":""}`);
  navigate("cook");
}

const ONBOARD_STEPS = 4;

function renderOnboarding(){
  const step = state.onboardStep;

  if(step === 0){

        <div style="margin-top:auto;">
          <button class="btn btn-primary" onclick="obNext()">Get Started</button>
        </div>
      </div>`;
  }

  if(step === 1){
    return `
      <div class="onboard-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${Math.round((step/(ONBOARD_STEPS-1))*100)}%;"></div></div>
        <h2 style="font-size:22px; margin:6px 0 4px;">Where are you cooking from?</h2>
        <p class="muted" style="font-size:13.5px; margin-bottom:14px;">This helps us suggest dishes and techniques that fit your region.</p>
        <div class="country-search">
          <input id="countrySearch" placeholder="Search your country" value="${p.country||""}"
            style="width:100%; border:1.5px solid var(--line); border-radius:14px; padding:13px 16px; font-size:14px; background:var(--card); color:var(--charcoal);"
            oninput="obFilterCountries(this.value)">
          <div id="countryList" class="country-list hidden"></div>
        </div>
        <div style="margin-top:auto; display:flex; gap:10px; padding-top:20px;">
          <button class="btn btn-ghost" style="flex:1;" onclick="obBack()">Back</button>
          <button class="btn btn-primary" style="flex:1;" onclick="obNext()" ${p.country?"":"disabled"}>Continue</button>
        </div>
      </div>`;
  }

  if(step === 2){
    return `
      <div class="onboard-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${Math.round((step/(ONBOARD_STEPS-1))*100)}%;"></div></div>
        <h2 style="font-size:22px; margin:6px 0 4px;">What's your cooking style?</h2>
        <p class="muted" style="font-size:13.5px; margin-bottom:10px;">Skill level</p>

            <button class="pref-tile ${p.skill===s?"active":""}" onclick="obSetSkill('${s}')">${s}</button>`).join("")}
        </div>
        <p class="muted" style="font-size:13.5px; margin:14px 0 10px;">Dietary preferences (optional, pick any)</p>
        <div class="pref-grid">
          ${DIETS.map(d=>`
            <button class="pref-tile ${p.diets.includes(d)?"active":""}" onclick="obToggleDiet('${d}')">${d}</button>`).join("")}
        </div>
        <div style="margin-top:auto; display:flex; gap:10px; padding-top:20px;">
          <button class="btn btn-ghost" style="flex:1;" onclick="obBack()">Back</button>
          <button class="btn btn-primary" style="flex:1;" onclick="obNext()">Continue</button>
        </div>
      </div>`;
  }

  // step 3 — allergies
  return `
    <div class="onboard-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:100%;"></div></div>
      <h2 style="font-size:22px; margin:6px 0 4px;">Anything to avoid?</h2>
      <p class="muted" style="font-size:13.5px; margin-bottom:10px;">We'll flag these in every recipe. Optional — skip if none apply.</p>
      <div class="pref-grid">
        ${COMMON_ALLERGENS.map(a=>`
          <button class="pref-tile ${p.allergies.includes(a)?"active":""}" onclick="obToggleAllergy('${a}')">${a}</button>`).join("")}
      </div>
      <div style="margin-top:auto; display:flex; gap:10px; padding-top:20px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="obBack()">Back</button>
        <button class="btn btn-primary" style="flex:1;" onclick="obFinish()">Start Cooking</button>
      </div>
    </div>`;
}

function bindOnboardingEvents(){
  // All onboarding interactions use inline onclick/oninput handlers — nothing extra to bind globally.
}

function obNext(){ setState({onboardStep: Math.min(state.onboardStep+1, ONBOARD_STEPS-1)}); }
function obBack(){ setState({onboardStep: Math.max(state.onboardStep-1, 0)}); }

function obFilterCountries(query){
  const list = document.getElementById("countryList");
  if(!list) return;
  const q = query.trim().toLowerCase();
  if(!q){ list.classList.add("hidden"); list.innerHTML=""; return; }
  const matches = COUNTRIES.filter(c=>c.toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){ list.classList.add("hidden"); list.innerHTML=""; return; }
  list.classList.remove("hidden");
  list.innerHTML = matches.map(c=>`<div class="country-item" onclick="obSelectCountry('${c.replace(/'/g,"\\'")}')"><span>${c}</span></div>`).join("");
}

function obSelectCountry(country){
  setState({profile:{...state.profile, country}});
  const input = document.getElementById("countrySearch");
  if(input) input.value = country;
  const list = document.getElementById("countryList");
  if(list){ list.classList.add("hidden"); list.innerHTML=""; }
}

function obSetSkill(skill){ setState({profile:{...state.profile, skill}}); }

function obToggleDiet(d){
  const diets = state.profile.diets.includes(d)
    ? state.profile.diets.filter(x=>x!==d)
    : [...state.profile.diets, d];
  setState({profile:{...state.profile, diets}});
}

function obToggleAllergy(a){
  const allergies = state.profile.allergies.includes(a)
    ? state.profile.allergies.filter(x=>x!==a)
    : [...state.profile.allergies, a];
  setState({profile:{...state.profile, allergies}});
}

function obFinish(){ setState({onboarded:true}); }

function renderBottomNav(){

  switch(state.route){

function addIngredient(){
  const input = document.getElementById("ingInput");
  const val = input.value.trim();
  if(!val) return;
  setState({ingredients:[...state.ingredients, {name:val, qty:"", unit:"", expiry:""}]});
  document.getElementById("ingInput").value="";
  document.getElementById("ingInput").focus();
}
function removeIngredient(idx){
  const next = [...state.ingredients]; next.splice(idx,1);

  const pane = document.getElementById("scannerPane");
  if(!pane) return;
  pane.innerHTML = `

function closeScanner(){ stopCamera(); const p=document.getElementById("scannerPane"); if(p) p.innerHTML=""; }

const THINKING_MESSAGES = [
  "Reading your ingredients…", "Matching global cooking techniques…", "Checking allergies & preferences…",
  "Weighing flavor combinations…", "Finalizing your recipe…"
];
async function handleGenerate(){
  const btn = document.getElementById("genBtn");
  const area = document.getElementById("genArea");
  if(!btn || !area) return;

  const freeInput = document.getElementById("freeRequest");
  const request = freeInput ? freeInput.value.trim() : "";

  if(!state.ingredients.length && !request){
    toast("Add a few ingredients or tell us what you want to make");
    return;
  }

  btn.disabled = true;
  btn.textContent = "✨ Thinking…";
  let msgIdx = 0;
  area.innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="spinner" style="border-top-color:var(--green); border-color:rgba(46,125,50,.2); margin:0 auto 14px;"></div>
      <p id="thinkingMsg" class="muted" style="font-size:13.5px;">${THINKING_MESSAGES[0]}</p>
    </div>`;
  const msgTimer = setInterval(()=>{
    msgIdx = (msgIdx+1) % THINKING_MESSAGES.length;
    const el = document.getElementById("thinkingMsg");
    if(el) el.textContent = THINKING_MESSAGES[msgIdx];
  }, 900);

  try{
    const recipes = await AI_ENGINE.generate({ingredients: state.ingredients, request, profile: state.profile});
    clearInterval(msgTimer);
    setState({lastRecipes: recipes});
    area.innerHTML = recipes.length
      ? recipes.map((r,i)=>recipeCard(r,i)).join("")
      : emptyState("🤔","No matches found","Try adding a few more ingredients or rephrasing your request.");
  }catch(e){
    clearInterval(msgTimer);
    area.innerHTML = `<div class="warn-banner">⚠️ Something went wrong generating recipes. Please try again.</div>`;
  }finally{
    btn.disabled = false;
    btn.textContent = "✨ Generate Recipes";
  }
}
